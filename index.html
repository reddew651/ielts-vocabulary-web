<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 听力词汇听写</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --sidebar-bg: #F5F5F7;
            --main-bg: #ffffff;
            --text: #1d1d1f;
            --text2: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --ok: #34C759;
            --ok-bg: #E4F7E8;
            --err: #FF3B30;
            --err-bg: #FFF0F1;
            --focus: #0077ED;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
        body { display:flex; height:100vh; background:var(--bg); color:var(--text); overflow:hidden; }

        /* ===== Sidebar ===== */
        .sidebar { width:300px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
        .sidebar-header { padding:18px 20px; font-size:17px; font-weight:700; border-bottom:1px solid var(--border); }
        #chapter-list { overflow-y:auto; flex:1; }
        .ch-group { border-bottom:1px solid rgba(0,0,0,.05); }
        .ch-hd { padding:14px 20px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14px; user-select:none; }
        .ch-hd:hover { background:rgba(0,0,0,.04); }
        .ch-arrow { font-size:11px; color:var(--text2); margin-right:8px; transition:transform .2s; }
        .ch-group.open .ch-arrow { transform:rotate(90deg); }
        .ch-stat { font-size:11px; color:var(--text2); background:rgba(0,0,0,.05); padding:2px 6px; border-radius:4px; }
        .pp-list { display:none; background:#fff; }
        .ch-group.open .pp-list { display:block; }
        .pp-item { padding:10px 20px 10px 44px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; border-left:3px solid transparent; }
        .pp-item:hover { background:#F5F5F7; }
        .pp-item.active { background:#E8F2FF; border-left-color:var(--accent); font-weight:500; color:var(--accent); }
        .pp-stat { font-size:11px; color:var(--text2); }
        
        /* Sidebar Footer for Sync/Backup */
        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: space-around; background: #fff;}
        .sidebar-footer button { flex:1; padding: 8px 0; font-size: 13px; font-weight: 500; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; transition: background .15s; }
        .sidebar-footer button:hover { background: #f5f5f7; }

        /* ===== Main ===== */
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--main-bg); }
        .topbar { padding:16px 36px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; gap:16px; flex-wrap:wrap; }
        .topbar-left { display:flex; flex-direction:column; gap:6px; }
        .title { font-size:22px; font-weight:700; }
        .stats { display:flex; gap:12px; font-size:13px; }
        .pill { padding:3px 10px; border-radius:10px; font-weight:500; background:#F5F5F7; }
        .pill.g { background:var(--ok-bg); color:var(--ok); }
        .pill.r { background:var(--err-bg); color:var(--err); }
        .topbar-right { display:flex; gap:10px; align-items:center; }
        .toggle-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; font-weight:500; transition:all .15s; user-select:none; }
        .toggle-btn:hover { background:#F5F5F7; }
        .toggle-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .submit-btn { padding:8px 22px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; font-size:14px; font-weight:600; transition:transform .1s; }
        .submit-btn:active { transform:scale(.96); }
        .submit-btn:disabled { opacity:.4; cursor:not-allowed; }
        .restart-btn { padding:8px 22px; border-radius:8px; border:1px solid var(--err); background:#fff; color:var(--err); cursor:pointer; font-size:14px; font-weight:600; transition:all .15s; display:none; }
        .restart-btn:hover { background:var(--err); color:#fff; }
        .err-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; font-weight:500; transition:all .15s; user-select:none; position:relative; }
        .err-btn:hover { background:#F5F5F7; }
        .err-badge { position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:9px; background:var(--err); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 4px; }
        .history-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; font-weight:500; transition:all .15s; user-select:none; }
        .history-btn:hover { background:#F5F5F7; }

        /* ===== Audio Player ===== */
        .audio-bar { display:none; padding:12px 36px; border-bottom:1px solid var(--border); background:#FAFAFA; align-items:center; gap:14px; flex-shrink:0; }
        .audio-bar.show { display:flex; }
        .audio-play { width:36px; height:36px; border-radius:50%; border:none; background:var(--accent); color:#fff; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .1s; }
        .audio-play:hover { transform:scale(1.08); }
        .audio-play:active { transform:scale(.95); }
        .audio-time { font-size:12px; color:var(--text2); white-space:nowrap; flex-shrink:0; min-width:90px; text-align:center; font-variant-numeric:tabular-nums; }
        .audio-seek { flex:1; height:6px; -webkit-appearance:none; appearance:none; background:#E5E5EA; border-radius:3px; outline:none; cursor:pointer; }
        .audio-seek::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); }
        .audio-seek::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; border:none; }
        .audio-speeds { display:flex; gap:4px; flex-shrink:0; }
        .spd-btn { padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:12px; font-weight:500; transition:all .15s; }
        .spd-btn:hover { background:#F5F5F7; }
        .spd-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

        /* ===== Word List ===== */
        .word-wrap { flex:1; overflow-y:auto; padding:0; }
        .wc { display:flex; align-items:center; padding:18px 36px; border-bottom:1px solid var(--border); gap:16px; transition:background .15s; }
        .wc:hover { background:#FAFAFA; }
        .wc-num { width:36px; font-size:13px; color:var(--text2); text-align:right; flex-shrink:0; }
        .wc-cn { flex:1; font-size:17px; transition:opacity .2s; }
        .wc-cn.hidden { opacity:0; user-select:none; pointer-events:none; }
        .wc-input { flex:1; max-width:320px; }
        .wc-input input { width:100%; padding:9px 12px; font-size:15px; border:1px solid var(--border); border-radius:8px; background:#fff; transition:all .2s; }
        .wc-input input:focus { border-color:var(--focus); box-shadow:0 0 0 3px rgba(0,119,237,.1); outline:none; }
        .wc-input input:disabled { background:#f9f9f9; }
        .wc-answer { flex:1; max-width:200px; font-size:15px; font-weight:600; opacity:0; transition:opacity .2s; }

        /* States after submit */
        .wc.ok { background:#F2FCF5; }
        .wc.ok input { border-color:var(--ok); color:var(--ok); font-weight:600; background:#F2FCF5; }
        .wc.ok .wc-answer { opacity:0; }
        .wc.ng { background:#FFF5F6; }
        .wc.ng input { border-color:var(--err); color:var(--err); background:#FFF0F1; text-decoration:line-through; }
        .wc.ng .wc-answer { opacity:1; color:var(--err); }

        .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); text-align:center; gap:8px; }

        /* ===== Error Panel ===== */
        .err-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:none; align-items:center; justify-content:center; }
        .err-overlay.show { display:flex; }
        .err-panel { background:#fff; border-radius:16px; width:90%; max-width:800px; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.2); }
        .err-panel-header { padding:20px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
        .err-panel-header h2 { font-size:20px; font-weight:700; }
        .err-close { width:32px; height:32px; border-radius:50%; border:none; background:#F5F5F7; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
        .err-close:hover { background:#E5E5EA; }
        .err-clear-btn { padding:6px 14px; border-radius:8px; border:none; background:var(--err); color:#fff; font-size:13px; font-weight:600; cursor:pointer; margin-right:8px; }
        .err-clear-btn:hover { opacity:.85; }
        .err-export-btn { padding:6px 14px; border-radius:8px; border:1px solid var(--accent); background:#fff; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; margin-right:8px; }
        .err-export-btn:hover { background:#E8F2FF; }
        .err-panel-body { overflow-y:auto; padding:20px 28px; flex:1; }
        .err-chapter-group { margin-bottom:20px; }
        .err-chapter-title { font-size:16px; font-weight:700; margin-bottom:10px; color:var(--text); }
        .err-paper-title { font-size:14px; font-weight:600; color:var(--text2); margin:8px 0 6px 12px; }
        .err-table { width:100%; border-collapse:collapse; margin-bottom:12px; margin-left:12px; }
        .err-table th { text-align:left; font-size:12px; color:var(--text2); padding:6px 10px; border-bottom:1px solid var(--border); font-weight:500; }
        .err-table td { padding:8px 10px; border-bottom:1px solid #f0f0f0; font-size:14px; }
        .err-count { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; border-radius:12px; background:var(--err-bg); color:var(--err); font-weight:700; font-size:13px; padding:0 6px; }
        .err-empty { text-align:center; padding:40px; color:var(--text2); }
        .history-date { margin:14px 0 8px; font-size:14px; font-weight:700; color:var(--text); }
        .history-table { width:100%; border-collapse:collapse; margin-bottom:8px; }
        .history-table th { text-align:left; font-size:12px; color:var(--text2); padding:6px 10px; border-bottom:1px solid var(--border); font-weight:500; }
        .history-table td { padding:8px 10px; border-bottom:1px solid #f0f0f0; font-size:14px; }
        .pct-strong { font-weight:700; color:var(--accent); }
        .history-group { margin-bottom:18px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
        .history-group-hd { background:#FAFAFA; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .history-group-title { font-size:14px; font-weight:700; color:var(--text); }
        .history-summary { font-size:12px; color:var(--text2); }
        .delta-up { color:var(--ok); font-weight:700; }
        .delta-down { color:var(--err); font-weight:700; }
        .delta-flat { color:var(--text2); font-weight:600; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">IELTS 听力词汇</div>
    <div id="chapter-list"></div>
    <div class="sidebar-footer">
        <button onclick="exportData()">导出备份</button>
        <button onclick="importData()">导入恢复</button>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div class="topbar-left">
            <div class="title" id="title">选择章节开始听写</div>
            <div class="stats" id="stats" style="display:none">
                <span class="pill g" id="s-ok">正确: 0</span>
                <span class="pill r" id="s-ng">错误: 0</span>
                <span class="pill" id="s-pct">正确率: 0%</span>
            </div>
        </div>
        <div class="topbar-right">
            <button class="history-btn" onclick="showHistoryPanel()">正确率记录</button>
            <button class="err-btn" id="btn-errlog" onclick="showErrPanel()">错词本<span class="err-badge" id="err-badge" style="display:none">0</span></button>
            <button class="toggle-btn" id="btn-hide-cn" onclick="toggleChinese()">隐藏中文</button>
            <button class="submit-btn" id="btn-submit" onclick="submitAll()" disabled>提交检查</button>
            <button class="restart-btn" id="btn-restart" onclick="restartPaper()">重新开始</button>
        </div>
    </div>
    <div class="audio-bar" id="audio-bar">
        <button class="audio-play" id="audio-play" onclick="togglePlay()" title="播放/暂停">▶</button>
        <span class="audio-time" id="audio-time">0:00 / 0:00</span>
        <input type="range" class="audio-seek" id="audio-seek" min="0" max="100" value="0" step="0.1" oninput="seekAudio(this.value)">
        <div class="audio-speeds">
            <button class="spd-btn active" onclick="setSpeed(1)">1x</button>
            <button class="spd-btn" onclick="setSpeed(1.2)">1.2x</button>
            <button class="spd-btn" onclick="setSpeed(1.4)">1.4x</button>
            <button class="spd-btn" onclick="setSpeed(1.6)">1.6x</button>
            <button class="spd-btn" onclick="setSpeed(1.8)">1.8x</button>
        </div>
    </div>
    <div class="word-wrap" id="word-wrap">
        <div class="empty">
            <h2>请从左侧选择 Test Paper</h2>
            <p>看中文，打英文，打完后点击「提交检查」</p>
            <p style="font-size:12px;color:#bbb;margin-top:12px">进度自动保存到浏览器</p>
        </div>
    </div>
</main>

<!-- Error Word Panel -->
<div class="err-overlay" id="err-overlay" onclick="if(event.target===this)hideErrPanel()">
    <div class="err-panel">
        <div class="err-panel-header">
            <h2>错词本</h2>
            <div style="display:flex;align-items:center;gap:8px">
                <button class="err-export-btn" onclick="exportErrAsMarkdown()">导出Markdown</button>
                <button class="err-clear-btn" onclick="clearAllErr()">一键清零</button>
                <button class="err-close" onclick="hideErrPanel()">&times;</button>
            </div>
        </div>
        <div class="err-panel-body" id="err-panel-body"></div>
    </div>
</div>

<!-- Accuracy History Panel -->
<div class="err-overlay" id="history-overlay" onclick="if(event.target===this)hideHistoryPanel()">
    <div class="err-panel">
        <div class="err-panel-header">
            <h2>正确率记录</h2>
            <button class="err-close" onclick="hideHistoryPanel()">&times;</button>
        </div>
        <div class="err-panel-body" id="history-panel-body"></div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
